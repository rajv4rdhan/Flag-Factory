challenges:
  - problem: "Cookies not persisting on Render.com custom subdomain due to Secure flag and CORS origin mismatch in production"
    solution: "Implemented dynamic cookie handling via COOKIE_DOMAIN, ENVIRONMENT and RENDER env vars for Secure/HttpOnly flags, and CORS middleware checking FRONTEND_URL and DOMAIN substring; documented in RENDER_DEPLOYMENT.md with Frontend withCredentials true"
    tags: [backend, security, cloud, devops]

  - problem: "Needed intentionally exploitable JWT for CTF while keeping normal auth functional for legitimate users"
    solution: "Built ParseJWT that accepts any signing method and falls back to ParseUnverified on error, always returning claims regardless of validity, allowing forged admin tokens without breaking GenerateJWT for real logins"
    tags: [backend, security, ctf]

  - problem: "Single-container deployment requires Go backend to serve built React frontend and handle client-side routing without separate hosting"
    solution: "Used multi-stage Docker (node build then go build) copying Frontend/dist to Backend/public, configured Gin Static and NoRoute fallback to index.html for non-API GETs, plus cpx ctd script for local sync"
    tags: [devops, cloud, frontend, backend]

  - problem: "Rate limiting needed for auth endpoints without external store, risking memory leak from per-IP limiters"
    solution: "Implemented in-memory RateLimiterStore with per-IP sliding window, RWMutex for concurrency, and background cleanup ticker every 5 minutes removing idle limiters"
    tags: [backend, security]
